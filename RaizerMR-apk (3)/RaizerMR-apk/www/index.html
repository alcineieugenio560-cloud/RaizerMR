<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0e17">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RaizerMR</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
video{position:fixed;top:0;height:100%;object-fit:cover;z-index:1;background:#05060f}
#v1{left:0;width:100%}#v2{display:none;left:50%;width:50%}
body.vr video{visibility:hidden}
body.mir video{transform:scaleX(-1)}
canvas{position:fixed;inset:0;z-index:8;pointer-events:none}
#ui{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;padding:10px;display:flex;flex-wrap:wrap;gap:8px;z-index:5}
body.vr #ui,body.vr #app{display:none!important}
button,.btn{background:rgba(36,38,44,.82);color:#f1f3f8;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:12px 18px;font-size:15px;text-decoration:none;display:inline-block;cursor:pointer;backdrop-filter:blur(10px)}
button:active{background:rgba(255,255,255,.22)}
#st{color:#dbe8ff;font-size:13px;flex-basis:100%;text-shadow:0 1px 4px #000}
#app{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(900px,94vw);height:min(560px,74vh);backface-visibility:hidden;pointer-events:auto;background:rgba(28,30,36,.97);border:1px solid rgba(255,255,255,.14);border-radius:28px;display:none;flex-direction:column;overflow:hidden}
#app header{display:flex;gap:10px;align-items:center;padding:12px 16px;background:transparent;color:#fff;font-size:18px;font-weight:600}
#world{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#cam3d{position:absolute;left:0;top:0;width:100%;height:100%;transform-style:preserve-3d;pointer-events:none}
#scan{position:fixed;top:120px;left:50%;transform:translateX(-50%);z-index:6;display:none;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;background:rgba(28,30,36,.88);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:12px 16px;color:#fff;max-width:90vw}
body.vr #scan{display:none!important}
body.xr video{display:none}
body.xr #app{left:0;top:0;width:900px;height:580px}
.chip{display:inline-flex;align-items:center;justify-content:center;width:62px;height:62px;border-radius:18px;background:#f2f4f8}
.chip img{width:80%;height:80%;object-fit:contain}.chip.s{width:34px;height:34px;border-radius:10px}
.ic{width:20px;height:20px;vertical-align:middle;margin-right:6px}
#ui{transition:opacity .25s}#ui.idle{opacity:0;pointer-events:none}
#flat{position:fixed;inset:0;z-index:6;pointer-events:none}
body.vr #flat,body.xr #flat{display:none}
#dock{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;padding:10px 12px;background:rgba(24,26,31,.84);border:1px solid rgba(255,255,255,.14);border-radius:32px;pointer-events:auto;max-width:96vw;overflow:auto}
#dock.off{display:none}
.dk{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border-radius:20px;background:transparent;border:none;color:#e8eaf0}
.dk small{font-size:11px}.dk .chip{width:52px;height:52px}
.dw{position:fixed;display:flex;flex-direction:column;background:rgba(28,30,36,.97);border:1px solid rgba(255,255,255,.14);border-radius:24px;pointer-events:auto;color:#f1f3f8;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.dh{display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:grab;touch-action:none;font-weight:600}
.dh b{flex:1}.dx{padding:6px;border-radius:50%;background:transparent;border:none}.dx img{width:22px;height:22px;display:block}
.db{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
.dr{position:absolute;right:0;bottom:0;width:34px;height:34px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 55%,rgba(255,255,255,.55) 55% 62%,transparent 62% 72%,rgba(255,255,255,.55) 72% 79%,transparent 79%)}
.grid3{display:grid!important;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px 8px;border-radius:22px;min-height:96px;font-size:14px}
.tile.sw{color:#fff;border:none}
.clk{font:700 56px/1.2 monospace;text-align:center;margin:auto}
.cdisp{background:#111418;border-radius:16px;padding:14px;font:700 34px monospace;text-align:right;color:#9fffcf}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;flex:1}.cgrid button{font-size:22px;padding:0}
.db textarea{flex:1;background:rgba(0,0,0,.3);color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:16px;padding:12px;font-size:16px;resize:none}
.reslist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:8px}
.res{display:flex;gap:10px;text-align:left;border-radius:16px;padding:8px;align-items:center}
.res img{width:140px;border-radius:10px}.res span{display:flex;flex-direction:column;gap:4px}.res small{color:#aab3c8}
.hl{outline:3px solid rgba(255,255,255,.85);outline-offset:2px}
#home{position:fixed;inset:0;z-index:30;background:radial-gradient(1200px 700px at 50% -10%,#1b2340,#0b0e17);overflow:auto;display:flex;justify-content:center;color:#f1f3f8}
#home .hbox{width:min(920px,94vw);padding:28px 0 40px}
#logo{width:min(250px,58vw);display:block;margin:0 auto 14px}#home p{text-align:center}
#home h1{margin:0 0 4px;font-size:34px;letter-spacing:.5px}#home p{margin:0 0 20px;color:#aab3c8}
#devs{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border-radius:22px;padding:16px;background:rgba(40,43,52,.85);min-height:112px}
.card span{font-size:34px}.card small{color:#aab3c8;font-size:12px}.card.on,#qbtns button.on{background:#3b5bff;border-color:#9bb0ff}
#gfx{display:grid;gap:14px;background:rgba(32,34,42,.8);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:18px;margin-bottom:22px}
#gfx label{display:grid;gap:6px;font-size:14px}#gfx label.chk{display:flex;gap:10px;align-items:center}#gfx input[type=range]{width:100%}
#gfx .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.big{font-size:20px;padding:16px 34px;background:#3b5bff;border-color:#9bb0ff;width:100%}
#app header b{flex:1}
#appbar{height:34px;display:flex;align-items:center;justify-content:center;cursor:grab;touch-action:none}
#appbar i{width:140px;height:9px;border-radius:5px;background:#cfe0ff;opacity:.85}
#appbody{flex:1;display:flex;flex-direction:column;gap:10px;padding:10px;color:#cfe8ff}
#appbody iframe{flex:1;border:0;background:#fff;border-radius:8px}
#appbody input{padding:12px 16px;font-size:16px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.35);color:#fff}
.tb{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.tb input{flex:1;min-width:140px}.tab.on{background:rgba(255,255,255,.25)}
.dial{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}.dial button{padding:18px 8px;font-size:15px}
.lst button{display:block;width:100%;text-align:left;margin:4px 0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
</head>

<video id="v2" playsinline muted autoplay></video>

  <button id="wk">Passos: desligado</button>

  <button id="rc">Recentrar</button>
  <button id="fs">Tela cheia</button>

  eul.set(m(gy.beta||0),m(gy.alpha||0),-m(gy.gamma||0),'YXZ');qg.setFromEuler(eul);qg.multiply(q1);qg.multiply(q0.setFromAxisAngle(zee,-o));
}
async function startGyro(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission){const r=await DeviceOrientationEvent.requestPermission();if(r!=='granted'){st('Giroscópio negado.');return;}}
    addEventListener('deviceorientation',e=>{if(e.alpha==null)return;gy=e;if(!gyOn){gyOn=true;recenter=true;}});
    if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission){try{await DeviceMotionEvent.requestPermission();}catch(e){}}
    addEventListener('devicemotion',stepDetect);
    setTimeout(()=>{if(!gyOn)st('O giroscópio não respondeu: sem ele o menu fica preso à tela. Permita "Sensores de movimento" para este site e abra por HTTPS.');},4500);
  }catch(e){st('Giroscópio indisponível: '+e.message);}
}

/* ---------- VR Box, Bluetooth, câmera ---------- */
function toggleVR(){vr=!vr;document.body.classList.toggle('vr',vr);if(vr){try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}if(vr&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});}
$('vr').onclick=toggleVR;$('mn').onclick=toggleMenu;$('mp').onclick=startScan;$('mh').onclick=()=>placeMenuFront();$('rc').onclick=()=>{recenter=true;};
$('fs').onclick=()=>{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});};
$('bt').onclick=async()=>{
  if(!navigator.bluetooth){st('Web Bluetooth indisponível aqui (use Chrome no Android). Controles que pareiam como teclado/gamepad funcionam direto: Enter ou botão A clica no ponto central.');return;}
  try{
    const d=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:['battery_service','device_information']});
    const s=await d.gatt.connect();st('Bluetooth: '+(d.name||'dispositivo')+' conectado');
    d.addEventListener('gattserverdisconnected',()=>st('Bluetooth desconectado'));
    try{const c=await(await s.getPrimaryService('battery_service')).getCharacteristic('battery_level');st('Bluetooth: '+(d.name||'dispositivo')+' · bateria '+(await c.readValue()).getUint8(0)+'%');}catch(e){}
  }catch(e){st('Bluetooth: '+e.message);}
};
$('start').onclick=async()=>{
  $('start').disabled=true;await startGyro();
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:640,height:480},audio:false});
    flip=stream.getVideoTracks()[0].getSettings().facingMode!=='environment';
    document.body.classList.toggle('mir',flip);
    video.srcObject=stream;video2.srcObject=stream;await video.play();video2.play().catch(()=>{});
    setTimeout(()=>{if(!video.videoWidth)st('A câmera abriu, mas não mostrou imagem. Feche outros apps que usam a câmera e tente de novo.');},2500);
    camOn=true;startScan();
    if(DEVS[CFG.dev]&&DEVS[CFG.dev].vr&&!vr)toggleVR();
    st('Câmera em tela cheia. Carregando rastreamento das mãos...');
    hands=new Hands({locateFile:f=>'lib/hands/'+f});
    hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:.6,minTrackingConfidence:.5});
    hands.onResults(onResults);await hands.initialize();
    st('Duas mãos ativas. Pince para clicar e segure a barra de baixo de qualquer janela ou do menu para mover. Menu: botão B/X do controle, tecla M ou Menu.');
    track();
  }catch(e){hands=null;st('Rastreamento de mão indisponível ('+e.message+'). Use toque, Bluetooth ou o ponto central.');}
};

/* ---------- loop ---------- */
addEventListener('resize',()=>renderer.setSize(innerWidth,innerHeight));renderer.setSize(innerWidth,innerHeight);
const clock=new THREE.Clock();
function frame(){
  if(!xrOn)requestAnimationFrame(frame);
  const t=clock.getElapsedTime(),now=performance.now();
  pollPad();
  const dt=Math.min(.1,t-lastT);lastT=t;
  if(recenter&&room.ready){recenter=false;st('Recentrar desativado: local mapeado (mapeie de novo para recentralizar).');}
  {const mx=(keys.d?1:0)-(keys.a?1:0)+padMx,mz=(keys.w?1:0)-(keys.s?1:0)+padMz;
   if(!xrOn&&(mx||mz)){const fw=centerDir();fw.y=0;if(fw.lengthSq()>.001){fw.normalize();cam.position.addScaledVector(fw,mz*dt*1.2).addScaledVector(new THREE.Vector3(-fw.z,0,fw.x),mx*dt*1.2);}}}
  if(pending>0&&!xrOn){const stp=Math.min(pending,1.6*dt),fw2=centerDir();fw2.y=0;if(fw2.lengthSq()>.001){fw2.normalize();cam.position.addScaledVector(fw2,stp);}pending-=stp;}
  slSpr.visible=scan.on;
  if(camOn&&!vr&&now-uiT>4500)$('ui').classList.add('idle');
  if(scan.on&&now-lastScan>200){lastScan=now;scanTick();}
  if(room.ready&&!scan.on&&now-lastPlace>350){lastPlace=now;placeTick();}
  if(xrOn){}
  else if(gyOn){
    gyroQuat();
    if(recenter){const f=new THREE.Vector3(0,0,-1).applyQuaternion(qg);yaw=-Math.atan2(-f.x,-f.z);recenter=false;}
    yq.setFromAxisAngle(upv,yaw);qt.copy(yq).multiply(qg);cam.quaternion.slerp(qt,CFG.smooth);
  }else{
    if(recenter){yaw=0;pitch=0;recenter=false;}
    eul.set(pitch,yaw,0,'YXZ');cam.quaternion.setFromEuler(eul);
  }
  cam.updateMatrixWorld();cam.getWorldPosition(camPos);
  H.forEach(o=>{if(o.dir&&now-o.seen>250)clearHand(o);});
  /* arrastar e redimensionar com uma ou duas mãos */
  const g0=H[0].grab,g1=H[1].grab;
  if(g0&&g1&&g0.g===g1.g&&H[0].dir&&H[1].dir){
    const g=g0.g,k=H[0].mid.distanceTo(H[1].mid)/g.userData.d0;g.scale.setScalar(Math.max(.5,Math.min(3,g.userData.s0*k)));
    const m=H[0].dir.clone().add(H[1].dir).normalize();g.position.copy(camPos).addScaledVector(m,g0.d);g.lookAt(camPos);
  }else H.forEach(o=>{if(o.grab&&o.dir){const g=o.grab.g;if(g.userData.kind==='map'&&!o.grab.move)panMap(g,o.dir,o.grab);else{g.position.copy(camPos).addScaledVector(o.dir,o.grab.d);g.lookAt(camPos);}}});
  H.forEach(o=>{if(o.mgrab&&o.dir){let dl=Math.atan2(-o.dir.x,-o.dir.z)-o.mgrab.th0;dl=Math.atan2(Math.sin(dl),Math.cos(dl));menuG.rotation.y=o.mgrab.y0+dl;menuG.position.y=Math.max(-.6,Math.min(1,o.mgrab.h0+(Math.asin(Math.max(-1,Math.min(1,o.dir.y)))-o.mgrab.p0)*2.4));}});
  H.forEach(o=>{if(o.rs&&o.dir)doResize(o.rs,o.dir);});if(mouseRs&&mouseDir)doResize(mouseRs,mouseDir);
  const dirs=H.filter(o=>o.dir).map(o=>o.dir);
  if(!dirs.length)dirs.push(vr||!mouseDir?centerDir():mouseDir);
  const hov=new Set(dirs.map(pick));
  menuHandle.material.color.setHex(hov.has(menuHandle)?0xffffff:0xaab4c8);
  H.forEach(o=>{
    if(!o.dir||now-o.seen>250){o.dwP=0;if(o.hlEl){o.hlEl.classList.remove('hl');o.hlEl=null;}return;}
    const t=pick(o.dir),t3=(t&&DW3.has(t.userData.type))?t:null;
    let el=null;if(!t3&&!(vr||xrOn)&&o.scr){const e=document.elementFromPoint(o.scr.sx,o.scr.sy);el=e&&e.closest('button,a,input,textarea,[data-tap]');}
    dwellFor(o,now,t3,el);
  });
  const handOn=H.some(o=>o.dir&&now-o.seen<250);
  if((vr||xrOn)&&!handOn){const t=pick(centerDir()),t3=(t&&DW3.has(t.userData.type))?t:null;dwellFor(gz,now,t3,null);gazeSpr.visible=true;gazeSpr.scale.setScalar(.05+.08*(gz.dwP||0));}else{gazeSpr.visible=false;gz.dwT=null;gz.dwP=0;}
  menuG.scale.setScalar(1);
  [...wins,appG].forEach(g=>{const u=g.userData;if(!u.frame)return;
    const near=hov.has(g===appG?appBody:u.panel)||hov.has(u.frameHit)||u.handles.some(h=>hov.has(h))||H.some(o=>o.rs&&o.rs.g===g)||(mouseRs&&mouseRs.g===g);
    u.fr+=((near?1:0)-u.fr)*.25;u.frame.visible=u.fr>.03;u.frM.opacity=u.fr*.7;u.hdM.opacity=u.fr*.95;
    u.handles.forEach(h=>{const hv=hov.has(h);h.scale.setScalar(hv?1.25:1);});
  });
  if(sky.visible){sky.rotation.y=-Math.PI/2;sky.position.copy(cam.position);}
  if(dust.visible&&(fN++&1)){dust.position.copy(cam.position);for(let i=0;i<dN;i++){dpos[i*3]+=dvel[i*3];dpos[i*3+1]+=dvel[i*3+1];dpos[i*3+2]+=dvel[i*3+2];if(dpos[i*3+1]>5)dpos[i*3+1]=-4;}dgeo.attributes.position.needsUpdate=true;}
  btns.forEach((b,i)=>{const h=hov.has(b);b.userData.s+=(1-b.userData.s)*.2;b.scale.setScalar(b.userData.s);
    b.material.color.setHex(h?0xffffff:0xc8ccd4);});
  wins.forEach(g=>{if(g.parent!==anchors)anchors.add(g);const u=g.userData;
    u.close.material.color.setHex(hov.has(u.close)?0xffffff:0xcfd3dc);
    if(u.kind==='cube')u.panel.rotation.y+=.01;
    if(u.kind==='map'){
      if(!(H.some(o=>o.grab&&o.grab.g===g)||(mapDrag&&mapDrag.g===g))){u.cx+=u.vx;u.cy+=u.vy;u.vx*=.94;u.vy*=.94;if(Math.abs(u.vx)+Math.abs(u.vy)>.05)u.dirty=true;else{u.vx=0;u.vy=0;}}
      if(u.dirty&&t-u.t>.03){u.t=t;u.dirty=false;drawMap(g);u.tex.needsUpdate=true;}
    }
    u.tiles.forEach(m=>{m.material.color.setHex(hov.has(m)?0xffffff:0xd2d6de);});
    if(u.kind==='clock'&&t-u.last>1){u.last=t;drawWin(u.tex.userData.x,512,335,u.title,'clock');u.tex.needsUpdate=true;}});
  anchors.visible=(vr||xrOn)&&!away&&!scan.on;
  render();
  updApp();adapt(dt);
}
function render(){
  if(xrOn){renderer.render(scene,cam);return;}
  const w=innerWidth,h=innerHeight;
  if(vr){
    renderVR(w,h);
  }else{
    renderer.setScissorTest(false);cam.fov=70;cam.aspect=w/h;cam.updateProjectionMatrix();
    renderer.setViewport(0,0,w,h);renderer.render(scene,cam);
  }
}
frame();
</script>
