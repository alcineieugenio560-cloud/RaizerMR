name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Localizar projeto
        run: |
          echo "=== ARQUIVOS DO REPOSITORIO ==="
          find . -maxdepth 3 -not -path './.git/*' -not -path '*/node_modules/*' | sort
          PKG=$(find . -name package.json -not -path '*/node_modules/*' | head -n 1)
          if [ -z "$PKG" ]; then
            echo "ERRO: nenhum package.json encontrado no repositorio"
            exit 1
          fi
          DIR=$(dirname "$PKG")
          echo "Projeto em: $DIR"
          echo "PROJ=$DIR" >> $GITHUB_ENV

      - name: Instalar dependencias
        working-directory: ${{ env.PROJ }}
        run: npm install

      - name: Adicionar plataforma Android
        working-directory: ${{ env.PROJ }}
        run: |
          if [ ! -d android ]; then
            npm install @capacitor/android
            npx cap add android
          fi

      - name: Sincronizar Capacitor
        working-directory: ${{ env.PROJ }}
        run: npx cap sync android

      - name: Permissao do gradlew
        working-directory: ${{ env.PROJ }}
        run: chmod +x android/gradlew

      - name: Compilar APK
        working-directory: ${{ env.PROJ }}/android
        run: ./gradlew assembleDebug

      - name: Enviar APK
        uses: actions/upload-artifact@v5
        with:
          name: RaizerMR
          path: ${{ env.PROJ }}/android/app/build/outputs/apk/debug/*.apk
