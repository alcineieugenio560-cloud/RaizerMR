name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Localizar o projeto Gradle
        id: proj
        run: |
          f=$(find . -maxdepth 3 -name settings.gradle.kts | head -n 1)
          if [ -z "$f" ]; then
            echo "settings.gradle.kts NAO encontrado. Arquivos do repositorio:"
            find . -maxdepth 3 -not -path './.git/*' | head -60
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Projeto encontrado em: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Instalar plataforma e build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Baixar modelo do MediaPipe (rastreamento de mãos)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 -o app/src/main/assets/hand_landmarker.task \
            https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task
          ls -la app/src/main/assets

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK (debug)
        working-directory: ${{ steps.proj.outputs.dir }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RaizerMR-debug-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar relatório de erros (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-de-erros
          path: ${{ steps.proj.outputs.dir }}/app/build/reports/
          if-no-files-found: ignore
